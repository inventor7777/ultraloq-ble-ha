# Keep this focused on useful checks for a HACS custom integration. Home Assistant
# Core's full Ruff policy is intentionally stricter than third-party repositories.

required-version = ">=0.16.0"
target-version = "py311"

[lint]
select = [
    "B007",  # Unused loop control variable
    "B014",  # Duplicate exception handler
    "C4",    # Comprehension improvements
    "C90",   # McCabe complexity
    "E",     # Pycodestyle errors
    "F",     # Pyflakes
    "I",     # Import sorting
    "ICN001", # Import conventions
    "PGH004", # Blanket noqa
    "PLC0414", # Useless import alias
    "SIM105", # contextlib.suppress instead of try/except/pass
    "SIM117", # Merge nested with statements
    "SIM118", # Use key in dict
    "SIM201", # Simplify negated equality
    "SIM212", # Simplify conditional expression
    "SIM300", # Avoid Yoda conditions
    "SIM401", # Use dict.get
    "T20",    # Print statements
    "TRY004", # Prefer TypeError for invalid types
    "RUF006", # Retain references to created tasks
    "UP",     # Modern Python syntax
    "W",      # Pycodestyle warnings
]
ignore = [
    "E501", # Ruff format handles line length where practical
]

[lint.flake8-import-conventions.extend-aliases]
voluptuous = "vol"
"homeassistant.helpers.config_validation" = "cv"
"homeassistant.helpers.device_registry" = "dr"
"homeassistant.util.dt" = "dt_util"

[lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[lint.isort]
force-sort-within-sections = true
known-first-party = ["homeassistant"]
combine-as-imports = true
split-on-trailing-comma = false

[lint.mccabe]
max-complexity = 25

[lint.pyupgrade]
keep-runtime-typing = true

[format]
exclude = [
    "custom_components/ultraloq_ble/utecio/__init__.py", # Capability table
    "custom_components/ultraloq_ble/utecio/const.py",    # CRC lookup table
]
skip-magic-trailing-comma = true
