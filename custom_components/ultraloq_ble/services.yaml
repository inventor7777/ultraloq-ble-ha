refresh_locks:
  name: Refresh Locks
  description: Refresh cached Ultraloq lock metadata from the U-tec cloud API and reload the integration.

get_device_information:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: ultraloq_ble

set_device_time:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: ultraloq_ble
    datetime:
      required: false
      example: "2026-08-18T16:30:00-05:00"
      selector:
        datetime:

set_device_autolock:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: ultraloq_ble
    duration:
      required: true
      default:
        minutes: 1
      selector:
        duration:
          enable_day: false
          enable_millisecond: false
    door_sensor:
      required: true
      default: false
      selector:
        boolean:
    enabled:
      required: true
      default: true
      selector:
        boolean:
    manual:
      required: false
      example: "3c0000"
      selector:
        text:
